name: CI

on:
  push:
    branches: [ main, template-prepare ]
  pull_request:
    branches: [ main, template-prepare ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FieldSales.slnx

      - name: Build solution
        run: dotnet build FieldSales.slnx --no-restore

      - name: Run unit tests (Fast Fail)
        run: dotnet test FieldSales.UnitTests/FieldSales.UnitTests.csproj --no-build --verbosity normal

      # SQL Server-backed tests (migration adoption, concurrency, secret-reveal instance
      # handoff) run for real here, not skipped — GitHub-hosted ubuntu runners ship Docker
      # already running, which Testcontainers needs. A silent skip would mean CI stops
      # proving the thing most likely to break: real schema migrations against real SQL Server.
      - name: Run integration test suite
        run: dotnet test FieldSales.slnx --no-build -m:1 --settings sqlserver.runsettings --verbosity normal

